<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>消息通知记录</title>
    <script src="/static/js/vue.js"></script>
    <link rel="stylesheet" href="/static/css/antd.min.css" />
    <script src="/static/js/moment.js"></script>
    <script src="/static/js/antd.min.js"></script>
</head>
<body>

<div id="app">
    <div class="top-nav">
        <a-menu v-model="current" mode="horizontal" @click="menuClick">
            <a-menu-item key="logs">
                通知记录
            </a-menu-item>
            <a-menu-item key="config">
                配置管理
            </a-menu-item>
        </a-menu>
    </div>

    <div class="log-actions">
        <a-button type="danger" @click="clearLogs" :loading="clearing">清理历史记录</a-button>
    </div>

    <div class="log-table">
        <a-table
            :key="tableKey"
            :columns="columns"
            :data-source="data"
            :pagination="pagination"
            :scroll="{ y: viewHeight }"
            @change="changeHandle">
        </a-table>

    </div>

</div>

</body>
<script>
    const columns = [
        {
            title:"#",
            dataIndex: 'index',
            key: 'index',
            width: 150,
        },
        {
            title: "消息标题",
            dataIndex: 'title',
            key: 'title',
        },
        {
            title: "消息内容",
            dataIndex: 'msg',
            key: 'msg',
        },
        {
            title: "备注",
            dataIndex: 'remark',
            key: 'remark',
        },
        {
            title: "时间",
            dataIndex: 'time',
            key: 'time',
            width: 300,
        },
        {
            title: "状态",
            dataIndex: 'status',
            key: 'status',
            width: 150,
        },
    ]

    const data = {{.msgList}}
    const total = {{.total}}
    const pageSize = {{.pageSize}}
    const currentPage = {{.currentPage}}

    function getEmHeightByClass(class_name){
        let ems = document.getElementsByClassName(class_name);
        return ems&&ems.length>0?ems[0].clientHeight:0;
    }

    new Vue({
        el: "#app",
        delimiters:["${", "}"],
        data(){
            return{
                tableKey:0,
                viewHeight:1080,
                testMsg:"",
                clearing:false,
                current: ['logs'],
                pagination:{
                    current: currentPage,
                    pageSize:pageSize,
                    total:total,
                },
                columns,
                data
            }
        },
        mounted(){
            this.calcTableHeadHeight();
            window.onresize = ()=>{
                this.calcTableHeadHeight()
            }
        },
        methods:{
            changeHandle(pagination){
                window.location.href = "/?page="+pagination.current
            },
            calcTableHeadHeight(){
                this.$nextTick(()=>{
                    // let allPaddingHeight = 15 + 5;
                    let tableHeadHeight = getEmHeightByClass("ant-table-thead");
                    let topNavHeight = getEmHeightByClass("top-nav");
                    let logActionsHeight = getEmHeightByClass("log-actions");
                    // let dateSearchHeight = getEmHeightByClass("top-date-picker");
                    // console.log('dateSearchHeight=',dateSearchHeight)
                    let paginationHeight = getEmHeightByClass('ant-table-pagination');
                    // let paginationAllMarginHeight = 16 * 2;

                    this.viewHeight = document.body.clientHeight - tableHeadHeight - paginationHeight - topNavHeight - logActionsHeight;
                    this.tableKey+=1;
                    console.log('viewHeight=', this.viewHeight)
                })
            },
            menuClick(e){
                if(e.key === "config"){
                    window.location.href = "/config"
                    return
                }
                if(e.key === "logs"){
                    window.location.href = "/"
                }
            },
            clearLogs(){
                if(!window.confirm("确定清理全部历史记录？")){
                    return
                }
                this.clearing = true;
                fetch("/api/logs/clear", { method: "POST" })
                    .then(res => res.json())
                    .then(data => {
                        if(data && data.message === "success"){
                            this.notify("历史记录已清理", "success");
                            window.location.href = "/";
                        }else{
                            this.notify((data && data.message) || "清理失败", "error");
                        }
                    })
                    .catch(() => {
                        this.notify("清理失败", "error");
                    })
                    .finally(() => {
                        this.clearing = false;
                    })
            },
            notify(message, type){
                if(this.$message && this.$message[type]){
                    this.$message[type](message);
                    return
                }
                alert(message);
            },
        }
    })
</script>
<style>
    .top-nav{
        background: #fff;
        border-bottom: 1px solid #f0f0f0;
    }
    .log-actions{
        display: flex;
        justify-content: flex-end;
        padding: 12px 16px;
        background: #fff;
        border-bottom: 1px solid #f0f0f0;
    }
</style>
</html>
